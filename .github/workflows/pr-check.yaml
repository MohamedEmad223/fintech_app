name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - feature/**

jobs:
  pr_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Analyzer
        run: flutter analyze .

      - name: Check Formatting
        run: dart format .
